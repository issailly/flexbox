<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tarjeta de Perfil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .tarjeta {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    /* Sección superior: avatar + nombre */
    .perfil-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 24px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid white;
      object-fit: cover;
    }

    .nombre-usuario {
      text-align: center;
    }

    .nombre {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .usuario {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* Bio */
    .bio {
      padding: 0 24px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #666;
      text-align: center;
    }

    /* Estadísticas */
    .estadisticas {
      display: flex;
      justify-content: space-around;
      padding: 24px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .estadistica {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .numero {
      font-size: 1.5rem;
      font-weight: 700;
      color: #667eea;
    }

    .etiqueta {
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Botones */
    .botones {
      display: flex;
      gap: 12px;
      padding: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primario {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primario:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secundario {
      background: #f0f0f0;
      color: #333;
      border: 2px solid #667eea;
    }

    .btn-secundario:hover {
      background: #f9f9f9;
      transform: translateY(-2px);
    }

    /* Miniaturas de proyectos */
    .miniaturas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 24px;
    }

    .miniatura {
      flex: 1;
      min-width: 100px;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .miniatura img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .tarjeta {
        max-width: 100%;
      }

      .nombre {
        font-size: 1.3rem;
      }

      .botones {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  
  <div class="tarjeta">
    
    <!-- Sección superior: avatar + nombre -->
    <div class="perfil-header">
      <img src="https://picsum.photos/seed/profile/100/100" alt="Avatar" class="avatar">
      <div class="nombre-usuario">
        <div class="nombre">Ana García</div>
        <div class="usuario">@ana.dev</div>
      </div>
    </div>
    
    <!-- Bio -->
    <p class="bio">
      Desarrolladora Full Stack 💻 | Amante del diseño moderno 🎨 | Café al 100% ☕
    </p>
    
    <!-- Estadísticas -->
    <div class="estadisticas">
      <div class="estadistica">
        <div class="numero">24</div>
        <div class="etiqueta">Proyectos</div>
      </div>
      <div class="estadistica">
        <div class="numero">3.2K</div>
        <div class="etiqueta">Seguidores</div>
      </div>
      <div class="estadistica">
        <div class="numero">487</div>
        <div class="etiqueta">Siguiendo</div>
      </div>
    </div>
    
    <!-- Botones -->
    <div class="botones">
      <button class="btn btn-primario">Seguir</button>
      <button class="btn btn-secundario">Mensaje</button>
    </div>
    
    <!-- Miniaturas de proyectos -->
    <div class="miniaturas">
      <div class="miniatura">
        <img src="https://picsum.photos/seed/proj1/120/120" alt="Proyecto 1">
      </div>
      <div class="miniatura">
        <img src="https://picsum.photos/seed/proj2/120/120" alt="Proyecto 2">
      </div>
      <div class="miniatura">
        <img src="https://picsum.photos/seed/proj3/120/120" alt="Proyecto 3">
      </div>
    </div>
    
  </div>

</body>
</html>
